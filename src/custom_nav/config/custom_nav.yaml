custom_nav_node:
  ros__parameters:
    odom_topic: "/odom/current_pose"
    goal_topic: "/goal"
    cmd_vel_topic: "/cmd_vel"
    standup_service: "/zs1w/stand_up"
    control_hz: 20.0
    linear_limit: 0.5
    angular_limit: 1.0
    goal_tolerance_xy: 0.15
    goal_tolerance_yaw: 0.1
    auto_standup: true
    motion_enabled: false
    map_topic: "/map"
    robot_radius: 0.35
    lookahead: 0.5
    treat_unknown_free: true
    # --- 避障 ---
    laser_topic: "/laser_scan"
    laser_frame: "base_link"        # NX 已把标定应用好; 若是原始系如 livox_frame 则套用 laser_ext_xy
    laser_ext_x: 0.0
    laser_ext_y: 0.0
    laser_inflation: 0.7
    replan_period: 0.25
    laser_range_max: 6.0
    laser_block_check_ahead: 0.8
    obstacle_detect_ahead: 1.5
    # --- 近障安全 ---
    emergency_stop_dist: 0.45       # 前方障碍 < 此距离 -> 转向避让, 无路才停
    slow_down_dist: 1.5             # 前方障碍 < 此距离 -> 线性降速
    front_clearance_sector: 1.2     # 前方探测扇区半角 (rad)
    # --- 原始点云层 (消除 0.5m 盲区 / 矮障碍) ---
    use_raw_lidar_cloud: true
    raw_cloud_topic: "/front_lidar"
    lidar_ext_x: 0.20985            # lidar_front->base_link (来自 calibration_results.yaml)
    lidar_ext_y: 0.0
    lidar_ext_z: 0.16952
    lidar_obstacle_height_min: 0.1  # 高度带=雷达平面上方 0.1~1.0m(与 NX laser_scan 一致, 排除地面)
    lidar_obstacle_height_max: 1.0
    lidar_min_xy: 0.45              # 排除机体足印
